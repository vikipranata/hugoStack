{{define "body"}}
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-brand">Hugo<em>Stack</em></div>
    <p class="login-sub">Sign in to manage your Hugo content.</p>
    <form id="login-form" class="form" method="POST" action="/login" autocomplete="on">
      <div class="field">
        <label class="field__label" for="user">Username</label>
        <input id="user" name="user" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label class="field__label" for="pass">Password</label>
        <input id="pass" name="pass" type="password" autocomplete="current-password" required>
      </div>
      <button id="login-btn" class="btn btn--primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
<div id="toast" class="toast" role="alert" aria-live="polite" hidden></div>
<script>
(function () {
  var form = document.getElementById("login-form");
  var btn = document.getElementById("login-btn");
  var toast = document.getElementById("toast");
  var timer = 0;
  function showToast(msg, ok) {
    clearTimeout(timer);
    toast.textContent = msg;
    toast.className = "toast toast--" + (ok ? "success" : "error");
    toast.hidden = false;
    timer = setTimeout(function () { toast.hidden = true; }, 3500);
  }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    btn.disabled = true;
    var orig = btn.textContent;
    btn.textContent = "Signing in\u2026";
    fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      credentials: "same-origin",
    }).then(function (res) {
      if (res.ok) {
        showToast("Signed in \u2014 welcome back", true);
        setTimeout(function () { location.replace("/"); }, 1000);
      } else {
        showToast("Invalid username or password", false);
        btn.disabled = false;
        btn.textContent = orig;
        document.getElementById("pass").focus();
      }
    }).catch(function (err) {
      showToast("Login failed: " + err.message, false);
      btn.disabled = false;
      btn.textContent = orig;
    });
  });
})();
</script>
{{end}}
